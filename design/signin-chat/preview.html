  chat: [['conversation','Hội thoại đã lưu'],['empty','Chat mới'],['signedout','Chưa đăng nhập'],['models','Chưa tải model'],['loading','Đang tải model'],['choose','Chưa chọn model'],['streaming','Đang trả lời'],['requesterror','Yêu cầu lỗi'],['saveerror','Lỗi lưu câu trả lời'],['transcript','Thiếu transcript'],['history','Lỗi đọc lịch sử'],['recording','Đang ghi âm']]
};
function sidebar(){return `<aside class="sidebar"><div class="traffic"><span></span><span></span><span></span></div><div class="brand"><span class="brand-mark">${icon('wave')}</span>LessMeet</div><div class="search">${icon('search')}Search recordings</div><div class="nav-item">${icon('books')}Library<span class="count">3</span></div><div class="section-label">TODAY</div><div class="record active">${icon('doc')}<div>Product weekly<small>10:30 AM · 24 min</small></div></div><div class="section-label" style="margin-top:19px">YESTERDAY</div><div class="record">${icon('doc')}<div>Customer research<small>32 min</small></div></div><div class="record">${icon('doc')}<div>Design sync<small>18 min</small></div></div><div class="side-bottom"><div class="local-model"><div class="row sub">${icon('disk')}Local models</div><small class="sub" style="font-size:10px">Ready for transcription</small></div><div class="account-entry" data-action="account" role="button" tabindex="0"><span class="avatar">${icon('chat')}</span><div><b>ChatGPT account</b><small>${screen==='signin'||state==='signedout'?'Sign in to chat':'Using ChatGPT plan'}</small></div></div></div></aside>`}
function shell(){return `<section class="content"><div class="toolbar">${icon('books')}Library<span style="color:#bcc2cc">/</span><span>Product weekly</span><span class="grow"></span><button data-action="noop">＋ New recording</button></div><div class="detail-heading"><h2>Product weekly</h2><div class="detail-meta"><span>October 13, 2026</span><span>·</span><span>24 min</span><span>·</span><span>Saved on this Mac</span></div></div><div class="detail-tabs"><div class="segmented"><span>Transcript</span><span class="selected">Chat</span></div><span class="context-label">${icon('doc')}This recording only</span></div><div class="history" id="history">${history()}</div>${composer()}<div class="playback"><span class="play">▶</span><span>04:12</span><div class="track"></div><span>24:08</span><span style="margin-left:4px">Audio · on this Mac</span></div></section>`}
function empty(title,description,prompts=false){return `<div class="empty"><div class="empty-icon">${icon('chat')}</div><h3>${title}</h3><p>${description}</p>${prompts?'<div class="prompts"><button data-prompt="Summarize the key decisions.">Summarize decisions</button><button data-prompt="What are the next steps?">Find next steps</button><button data-prompt="What questions remain open?">Find open questions</button></div>':''}</div>`}
function history(){
 if(screen==='signin') return empty('A little clarity after every meeting.','Ask about this recording’s transcript. Completed chats stay on this Mac.');
 if(['empty','models','choose','loading'].includes(state)) return empty('What would you like to know?','Turn this transcript into a clear summary, next steps, or answers to your questions.',true);
 if(state==='history')return empty('Saved chat couldn’t be opened.','The saved history has not been changed. Resolve the local file issue before sending another question.');
 if(state==='transcript')return empty('Start with a transcript.','This recording has no local transcript text. Transcribe it on this Mac before sending a question.');
 let partial = state==='streaming';
 return `<div class="conversation"><div class="question">What did we decide, and what should happen next?</div><div class="speaker">${logo}ChatGPT<span class="sub">${partial?'Incomplete answer · not saved':'From this recording’s transcript'}</span></div><article class="answer"><p>The team agreed to keep the first release focused on a clear, reliable meeting workflow.</p><h3>Three decisions to carry forward</h3><ol><li><strong>Keep the first release small.</strong> Prioritize recording, a readable transcript, and follow-up questions.</li><li><strong>Make the next step obvious.</strong> Use one primary action in each state.</li>${partial?'':'<li><strong>Review before building.</strong> Share the sign-in and chat mockups before changing the app.</li>'}</ol>${partial?'<p style="color:#7288ad">Answering…</p>':'<div class="saved">'+icon('disk')+'Completed chat saved on this Mac</div>'}</article></div>`;
}
function notice(title,text,action='',type=''){return `<div class="notice ${type}"><div class="row">${icon('alert')}<div><b>${title}</b>${text}${action}</div></div></div>`}
function composer(){
 const signedout=screen==='signin'||state==='signedout';
 const busy=['streaming','loading'].includes(state);
 const disabled=signedout||busy||['models','choose','history','recording'].includes(state);
 let message='';
 if(signedout)message=notice('Sign in to ask a question.','You can still read completed chats saved on this Mac.','<br><button class="link" data-action="account">Continue with ChatGPT →</button>');
 if(state==='models')message=notice('Choose how ChatGPT answers.','Load the models available to your account, then select one.');
 if(state==='loading')message=notice('Loading available models…','No question has been sent. You can cancel this request.');
 if(state==='choose')message=notice('Select a model to continue.','Nothing is selected automatically.');
 if(state==='requesterror')message=notice('The request couldn’t be completed.','Your draft and previous history are unchanged. No automatic retry was made.','<br><button class="link" data-action="usage">Manage usage ↗</button>','error');
 if(state==='saveerror')message=notice('The completed answer couldn’t be saved.','Previous history is unchanged. Your draft is kept. No retry was made.','<br><button class="link" data-action="usage">Manage usage ↗</button>','error');
 if(state==='transcript')message=notice('No question was sent.','This recording has no local transcript text. Transcribe it before sending.','<br><button class="link" data-action="transcript">Go to Transcript →</button><span> · </span><button class="link" data-action="usage">Manage usage ↗</button>');
 if(state==='history')message=notice('Sending is unavailable.','Could not read local chat history. It was not changed. Repair the saved history before sending.','<br><button class="link" data-action="usage">Manage usage ↗</button>','error');
 if(state==='recording')message=notice('Finish recording to send a question.','Chat is paused while a recording is active. Completed chats remain available.');
 let modelEmpty=['models','loading','choose'].includes(state)||signedout;
 return `<div class="composer-wrap"><div class="composer-inner">${message}<div class="helper-row"><span>${signedout?'Saved chats remain local':'Using ChatGPT plan · <button class="link" data-action="usage">Manage usage ↗</button>'}</span><span class="key-hint">Return for a new line · ⌘Return to send</span></div><div class="composer"><textarea id="draft" aria-label="Question about this transcript" placeholder="Ask about this transcript…">${escapeHTML(draft)}</textarea><div class="composer-bottom"><select class="model-picker" id="model-picker" aria-label="ChatGPT model" ${signedout||busy||state==='models'||state==='recording'?'disabled':''}><option value="" ${modelEmpty?'selected':''}>Choose a model</option>${signedout||['models','loading'].includes(state)?'':'<option value="sample" '+(!modelEmpty?'selected':'')+'>Example model</option>'}</select><button class="plain small-control" data-action="load" ${signedout||busy||state==='recording'?'disabled':''}>${modelEmpty?'Load models':'Refresh'}</button><span class="grow"></span>${busy?'<button class="small-control" data-action="cancel">Cancel</button>':''}<button class="primary send-button" data-action="send" ${disabled||!draft.trim()?'disabled':''}>Send ${icon('arrow')}</button></div></div><div class="disclosure">When you send, LessMeet sends the full local transcript and this conversation to OpenAI. Audio stays local.</div></div></div>`;
}
function sheet(){
 let body='';
 const art=`<div class="connection-art"><span class="app-tile lm">${icon('wave')}</span><span class="connect-line">···</span><span class="app-tile">${logo}</span></div>`;
 const footer='<div class="sheet-footer">Recording and local transcription do not require sign-in.<br>Your saved chats remain available on this Mac.</div>';
 if(['signedout','autherror'].includes(state))body=`${art}<h2>Your meetings.<br>A clearer next step.</h2><p class="intro">Connect ChatGPT to ask questions about<br>your meeting transcripts in LessMeet.</p><div class="benefits"><div class="benefit">${icon('chat')}<div><b>Use your ChatGPT plan</b><span>Eligible requests count toward your plan’s usage.</span></div></div><div class="benefit">${icon('shield')}<div><b>Know what you share</b><span>When you send a question, the full transcript and conversation go to OpenAI. Audio stays local.</span></div></div></div>${state==='autherror'?notice('Sign-in wasn’t completed.','The browser step failed or expired. Try again when you’re ready.','','error'):''}<button class="signin" data-action="signin">${logo}Continue with ChatGPT</button><div class="browser-note">Continues securely in your browser</div>${footer}`;
 if(state==='waiting')body=`<div class="wait-icon">${icon('browser')}</div><h2>Continue in your browser.</h2><p class="intro">Finish the ChatGPT sign-in step there.<br>LessMeet will update when you return.</p><div class="waiting-steps"><div>Browser sign-in started</div><div class="current">Waiting for your authorization</div><div>Return to LessMeet</div></div><div class="notice">If the browser does not open, cancel and try again.<br>Closing this sheet does not cancel sign-in.</div><button class="wide" data-action="cancel-auth">Cancel sign-in</button><div class="browser-note">No chat request has been sent.</div>${footer}`;
 if(['connected','consent','switch','signout'].includes(state))body=`${art}<h2>${state==='consent'?'One more step to chat.':state==='switch'?'Choose your account.':state==='signout'?'Sign-out needs attention.':'You’re connected.'}</h2><p class="intro">${state==='consent'?'This account has not enabled ChatGPT plan usage.':state==='switch'?'Select an account, then continue in your browser.':state==='signout'?'Chat access is disabled. Sign-out needs an explicit retry.':'Ask questions using your ChatGPT plan.'}</p><div class="profile"><span class="avatar">JD</span><div class="grow"><b>Jamie · Personal</b><small>Example account · not a real session</small></div>${state==='connected'?'<span class="status-pill">Connected</span>':''}</div>${state==='switch'?'<select class="switcher" aria-label="Account"><option>Jamie · Personal (example)</option><option>New account or workspace</option></select>':''}${state==='signout'?notice('Sign-out could not be confirmed.','Some local or remote cleanup may be incomplete. Saved chats remain on this Mac.','','error'):''}<button class="${state==='connected'?'primary wide':'signin'}" data-action="${state==='connected'?'back-chat':'signin'}">${state==='connected'?'Back to chat':state==='consent'?'Enable ChatGPT plan usage':state==='signout'?'Retry sign-out':logo+'Continue with ChatGPT'}</button><div class="account-actions"><button data-action="switch">Switch account</button><button data-action="add">Add account</button></div><div class="row" style="justify-content:space-between;margin:20px 0"><button class="link" data-action="usage">Manage usage ↗</button><button class="link quiet-danger" data-action="signout">Sign out</button></div>${footer}`;
 if(state==='welcome')body=`<div class="wait-icon">${icon('check')}</div><h2>You’re using<br>your ChatGPT plan.</h2><p class="intro">Eligible LessMeet chat requests count toward your ChatGPT plan usage. Review usage and limits in ChatGPT settings.</p><div style="text-align:center;margin:20px 0 26px"><button class="link" data-action="usage">Manage usage ↗</button></div><button class="primary wide" data-action="acknowledge">Got it</button>`;
 return `<div class="stage-shade"><section class="sheet" role="dialog" aria-label="ChatGPT account"><div class="sheet-top">${icon('chat')}<span style="margin-left:8px">ChatGPT account</span><span class="grow"></span>${state==='welcome'?'':'<button class="plain" data-action="close">Done</button>'}</div><div class="sheet-body">${body}</div></section></div>`;
}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 if(!states[screen].some(x=>x[0]===state))state=states[screen][0][0];
 document.body.classList.toggle('dark',dark);
 document.getElementById('theme').textContent=dark?'◐ Light':'◐ Dark';
 document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===screen));
 document.getElementById('state-picker').innerHTML=states[screen].map(([v,t])=>`<option value="${v}" ${state===v?'selected':''}>${t}</option>`).join('');
 document.getElementById('board-title').textContent=screen==='signin'?'Sign in, without the clutter.':'A conversation with your meeting.';
 document.getElementById('design-note').textContent=screen==='signin'?'01 / Một CTA chính · Sheet theo ngữ cảnh · Chia sẻ dữ liệu rõ ràng':'02 / Nội dung là trọng tâm · Model cạnh ô nhập · Lịch sử theo recording';
 document.getElementById('app').innerHTML=sidebar()+shell()+(screen==='signin'?sheet():'');
 if(screen==='signin'){document.querySelector('.content').inert=true;document.querySelector('.sidebar').inert=true;}
}
function show(nextScreen,nextState){screen=nextScreen;state=nextState;render()}
function toast(text){document.querySelector('.toast')?.remove();let t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),3500)}
document.addEventListener('click',event=>{
 const button=event.target.closest('button,[data-action]');if(!button)return;
 if(button.dataset.screen){draft='';show(button.dataset.screen,button.dataset.screen==='chat'?'conversation':'signedout');return}
 if(button.id==='theme'){dark=!dark;render();return}
 if(button.dataset.prompt){draft=button.dataset.prompt;render();document.getElementById('draft').focus();return}
 switch(button.dataset.action){
 case 'account':show('signin','signedout');break;
 case 'signin':if(state==='signout'){toast('Mô phỏng: retry sign-out. Không gọi mạng.');show('signin','signedout')}else show('signin','waiting');break;
 case 'cancel-auth':show('signin','signedout');break;
 case 'close':if(state==='waiting')toast('Mockup: đóng sheet không hủy sign-in. Dùng Cancel sign-in để hủy.');show('chat','signedout');break;
 case 'acknowledge':show('signin','connected');break;
 case 'back-chat':show('chat','models');break;
 case 'switch':newAccount=false;show('signin','switch');break;
 case 'add':newAccount=true;show('signin','switch');document.querySelector('.switcher').selectedIndex=1;break;
 case 'signout':show('signin','signedout');toast('Mô phỏng đăng xuất. Không thay đổi tài khoản thật.');break;
 case 'usage':toast('Preview: liên kết Manage usage bị vô hiệu hóa.');break;
 case 'load':show('chat','choose');toast('Danh sách model mẫu. Không gọi API.');break;
 case 'send':show('chat','streaming');toast('Chỉ mô phỏng. Dùng bộ chọn trạng thái để xem kết quả hoặc lỗi.');break;
 case 'cancel':show('chat',state==='loading'?'models':'conversation');toast('Mô phỏng hủy: bỏ phần trả lời chưa hoàn tất; giữ draft.');break;
 case 'transcript':toast('Preview: chuyển sang Transcript để chép lời trên máy.');break;
 default:toast('Control ngoài phạm vi preview; không thực hiện hành động.');
 }
});
document.getElementById('state-picker').addEventListener('change',e=>{state=e.target.value;if(['requesterror','saveerror','transcript','streaming'].includes(state))draft='What should we do next?';render()});
document.addEventListener('input',e=>{if(e.target.id==='draft'){draft=e.target.value;const send=document.querySelector('[data-action="send"]');send.disabled=!draft.trim()||screen==='signin'||['signedout','models','loading','choose','streaming','history','recording'].includes(state)}});
document.addEventListener('change',e=>{if(e.target.id==='model-picker'){state=e.target.value?'empty':'choose';render()}});
document.addEventListener('keydown',e=>{if(e.metaKey&&e.key==='Enter'&&e.target.id==='draft'){e.preventDefault();document.querySelector('[data-action="send"]')?.click()}if(e.key==='Enter'&&e.target.classList.contains('account-entry'))show('signin','signedout')});
render();
</script>
</body>
</html>
